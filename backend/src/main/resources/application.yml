server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  catalog:
    seed-teacher-id: ${CATALOG_SEED_TEACHER_ID:0}
  upload-dir: ${APP_UPLOAD_DIR:D:/project/learning-platform-springboot/backend/uploads}
  report-dir: ${APP_REPORT_DIR:D:/project/learning-platform-springboot/backend/reports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:${random.uuid}${random.uuid}}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:86400}
    teacher-registration-code: ${TEACHER_REGISTRATION_CODE:teacher-dev-2026}
    admin-email: ${ADMIN_EMAIL:admin@zhidu.local}
    admin-password: ${ADMIN_PASSWORD:admin-dev-2026}
  neo4j:
    enabled: ${NEO4J_ENABLED:true}
    uri: ${NEO4J_URI:neo4j://127.0.0.1:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:12345678}
    connection-timeout-ms: ${NEO4J_CONNECTION_TIMEOUT_MS:2000}
    acquisition-timeout-ms: ${NEO4J_ACQUISITION_TIMEOUT_MS:2000}
    retry-timeout-ms: ${NEO4J_RETRY_TIMEOUT_MS:800}
    failure-cooldown-ms: ${NEO4J_FAILURE_COOLDOWN_MS:10000}
  ai:
    enabled: ${AI_TUTOR_ENABLED:false}
    provider: ${AI_PROVIDER:ollama}
    max-concurrent: ${AI_MAX_CONCURRENT:1}
    max-queue: ${AI_MAX_QUEUE:5}
    message-max-chars: ${AI_MESSAGE_MAX_CHARS:1000}
    context-max-chars: ${AI_CONTEXT_MAX_CHARS:3500}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:10}
    stream-timeout-ms: ${AI_STREAM_TIMEOUT_MS:150000}
    llama-factory:
      tool-calling-enabled: ${LLAMAFACTORY_TOOL_CALLING_ENABLED:false}
      base-url: ${LLAMAFACTORY_BASE_URL:http://127.0.0.1:8000/v1}
      model: ${LLAMAFACTORY_MODEL:zhidu-qwen3-4b-lora}
      api-key: ${LLAMAFACTORY_API_KEY:}
      connect-timeout-ms: ${LLAMAFACTORY_CONNECT_TIMEOUT_MS:3000}
      response-timeout-ms: ${LLAMAFACTORY_RESPONSE_TIMEOUT_MS:120000}
      max-tokens: ${LLAMAFACTORY_MAX_TOKENS:600}
      context-window: ${LLAMAFACTORY_CONTEXT_WINDOW:4096}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:qwen3:8b-q4_K_M}
      connect-timeout-ms: ${OLLAMA_CONNECT_TIMEOUT_MS:3000}
      response-timeout-ms: ${OLLAMA_RESPONSE_TIMEOUT_MS:120000}
      keep-alive: ${OLLAMA_KEEP_ALIVE:15m}
      think: ${OLLAMA_THINK:false}
      num-ctx: ${OLLAMA_NUM_CTX:4096}
      num-predict: ${OLLAMA_NUM_PREDICT:600}
