server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  upload-dir: ${APP_UPLOAD_DIR:D:/project/learning-platform-springboot/backend/uploads}
  report-dir: ${APP_REPORT_DIR:D:/project/learning-platform-springboot/backend/reports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:${random.uuid}${random.uuid}}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:86400}
    teacher-registration-code: ${TEACHER_REGISTRATION_CODE:teacher-dev-2026}
    admin-email: ${ADMIN_EMAIL:admin@zhidu.local}
    admin-password: ${ADMIN_PASSWORD:admin-dev-2026}
  neo4j:
    enabled: ${NEO4J_ENABLED:true}
    uri: ${NEO4J_URI:neo4j://127.0.0.1:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:12345678}
    connection-timeout-ms: ${NEO4J_CONNECTION_TIMEOUT_MS:2000}
    acquisition-timeout-ms: ${NEO4J_ACQUISITION_TIMEOUT_MS:2000}
    retry-timeout-ms: ${NEO4J_RETRY_TIMEOUT_MS:800}
    failure-cooldown-ms: ${NEO4J_FAILURE_COOLDOWN_MS:10000}
